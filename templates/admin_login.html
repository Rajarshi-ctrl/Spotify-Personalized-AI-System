<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Portal Login - Spotify AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #ffffff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-card { background: #181818; border: 1px solid #282828; border-radius: 10px; width: 100%; max-width: 400px; padding: 32px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    h2 { color: #1db954; margin-bottom: 8px; text-align: center; }
    p.sub { color: #b3b3b3; font-size: 0.85rem; text-align: center; margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.85rem; color: #b3b3b3; margin-bottom: 6px; font-weight: 600; }
    input[type="text"], input[type="password"] { width: 100%; padding: 12px; background: #282828; border: 1px solid #3e3e3e; border-radius: 6px; color: #fff; font-size: 0.95rem; }
    input:focus { outline: none; border-color: #1db954; }
    button { width: 100%; padding: 12px; background: #1db954; border: none; border-radius: 24px; color: #000; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: 0.2s; }
    button:hover { background: #1ed760; }
    .alert { padding: 10px 14px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 16px; }
    .alert-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; }
    .alert-warning { background: rgba(245, 158, 11, 0.2); border: 1px solid #f59e0b; color: #fcd34d; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>Spotify AI Admin</h2>
    <p class="sub">Backend Database & CRUD Control</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="alert alert-{{ category }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('admin.login') }}">
      <div class="form-group">
        <label>Admin Username</label>
        <input type="text" name="username" placeholder="e.g. admin123" required autocomplete="off">
      </div>
      <div class="form-group">
        <label>Admin Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit">Sign In to Dashboard</button>
    </form>
  </div>
</body>
</html>
